name: golines test
on:
  push:
    branches:    
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    name: golines test (on ${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
      - name: test golines
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test
